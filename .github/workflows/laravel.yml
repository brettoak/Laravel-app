name: Deploy Laravel App to Azure VM

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, bcmath
          ini-values: post_max_size=256M, upload_max_filesize=256M

      # 3. Install Composer dependencies
      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      # 3.5. Create .env file for Vite build
      - name: Create .env for Vite
        run: |
          echo "VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}" >> .env
          echo "VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}" >> .env
          echo "VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}" >> .env
          echo "VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}" >> .env

      # 4. Build front-end assets
      - name: Build Frontend (Vite)
        env:
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build
          fi

      # 5. Laravel Optimizations
      - name: Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # 6. Setup SSH
      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # 7. Deploy to server using rsync
      - name: Deploy Laravel App
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.LARAVEL_DEPLOY_DIR }}
        run: |
          if [[ ! "$DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "LARAVEL_DEPLOY_DIR must be a non-empty absolute path."
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" \
            "sudo mkdir -p '$DEPLOY_DIR' && sudo chown -R \$(id -un):\$(id -gn) '$DEPLOY_DIR'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude ".env" \
            --exclude "ca.pem" \
            ./ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      # 8. Run Laravel commands on server
      - name: Run post-deploy commands on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.LARAVEL_DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "
          cd '$DEPLOY_DIR' && \

          # Install composer dependencies without dev packages and optimize autoloader
          composer install --no-dev --optimize-autoloader && \

          # Change ownership of storage and bootstrap/cache to www-data user/group
          sudo chown -R www-data:www-data storage bootstrap/cache && \

          # Set read/write/execute permissions for owner and group on storage and bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache && \

          # Remove the config cache copied from CI without touching the database cache
          sudo -u www-data php artisan config:clear && \

          # Create application tables before optimize:clear accesses the database cache
          sudo -u www-data php artisan migrate --force && \

          # Clear all existing caches to ensure fresh state
          sudo -u www-data php artisan optimize:clear && \

          # Cache the configuration for better performance
          sudo -u www-data php artisan config:cache && \

          # Cache the routes to improve route lookup performance
          sudo -u www-data php artisan route:cache && \

          # Cache the compiled views for faster rendering
          sudo -u www-data php artisan view:cache
          "
